name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build NEXUS (release)
        run: swift build -c release
      - name: Build Red Triangle (release)
        run: swiftc -swift-version 5 -O NexusTriangle/main.swift -o /tmp/NexusTriangle
